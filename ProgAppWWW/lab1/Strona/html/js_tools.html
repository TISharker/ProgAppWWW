<h3>Narzędzia JS (Lab)</h3>

<h4>Konwerter</h4>
<form method="post" name="entryform">
    <input type="text" name="input" size="10" onchange="convert(this.form,this.form.measure1,this.form.measure2)">
    <select name="measure1">
        <option value="1">metr</option>
        <option value="0.0254">cal</option>
        <option value="0.3048">stopa</option>
    </select>
    ->
    <input type="text" name="display" size="10" readonly>
    <select name="measure2">
        <option value="1">metr</option>
        <option value="0.0254">cal</option>
        <option value="0.3048">stopa</option>
    </select>
    <input type="button" value="Oblicz" onclick="convert(this.form,this.form.measure1,this.form.measure2)">
</form>
